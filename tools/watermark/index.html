<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>超赞水印 · 批量图片加水印</title>
<meta name="description" content="在线批量图片加水印：文字水印、图片水印、全屏平铺、九宫格定位，可调透明度、旋转、描边与阴影，支持 PNG / JPG / WebP 批量导出。全程浏览器本地处理，不上传图片。">
<meta name="theme-color" content="#1F5FBF">
<link rel="icon" href="/assets/logo.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <a class="back" href="/" title="返回超赞工具箱" aria-label="返回超赞工具箱">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <a class="brand" href="/">
    <img src="/assets/logo.svg" alt="超赞工具箱">
    <span>超赞水印</span>
  </a>
  <span class="tagline">批量加水印 · 文字 / 图片 · 本地处理</span>
  <div class="top-actions">
    <button class="btn btn-ghost" id="btnTheme" title="切换深浅色" aria-label="切换深浅色">◐</button>
    <button class="btn btn-ghost" id="btnClear">清空</button>
    <button class="btn btn-primary" id="btnExportAll" disabled>批量导出</button>
  </div>
</header>

<main class="wrap">
  <div class="studio">

    <!-- ═════════ 左：设置 ═════════ -->
    <aside class="panel">

      <section class="card">
        <div class="card-head">
          <h2>图片</h2>
          <span class="hint" id="fileCount">0 张</span>
        </div>
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择图片">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
          <b>点击或拖拽图片到这里</b>
          <small>支持 JPG / PNG / WebP，可多选</small>
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
        </div>
        <div class="files" id="files"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>水印内容</h2>
        </div>
        <div class="seg" id="typeSeg" role="tablist">
          <button data-type="text" class="on" role="tab">文字水印</button>
          <button data-type="image" role="tab">图片水印</button>
        </div>

        <!-- 文字 -->
        <div class="pane" id="paneText">
          <label class="field">
            <span>水印文字</span>
            <input id="text" type="text" value="超赞工具箱" maxlength="60" placeholder="输入水印文字">
          </label>
          <div class="row2">
            <label class="field">
              <span>字号 <b id="vSize">32</b></span>
              <input id="size" type="range" min="8" max="200" value="32">
            </label>
            <label class="field">
              <span>字间距 <b id="vSpacing">0</b></span>
              <input id="spacing" type="range" min="-10" max="40" value="0">
            </label>
          </div>
          <div class="row2">
            <label class="field">
              <span>颜色</span>
              <div class="color-wrap">
                <input id="color" type="color" value="#ffffff">
                <input id="colorHex" type="text" value="#FFFFFF" maxlength="7" spellcheck="false">
              </div>
            </label>
            <label class="field">
              <span>字体</span>
              <select id="font">
                <option value="system">系统黑体</option>
                <option value="song">宋体</option>
                <option value="kai">楷体</option>
                <option value="serif">衬线</option>
                <option value="mono">等宽</option>
              </select>
            </label>
          </div>
          <div class="toggles">
            <label class="chk"><input type="checkbox" id="bold" checked><span>加粗</span></label>
            <label class="chk"><input type="checkbox" id="stroke"><span>描边</span></label>
            <label class="chk"><input type="checkbox" id="shadow" checked><span>阴影</span></label>
          </div>
          <div class="row2" id="strokeRow" hidden>
            <label class="field">
              <span>描边颜色</span>
              <div class="color-wrap">
                <input id="strokeColor" type="color" value="#000000">
                <input id="strokeHex" type="text" value="#000000" maxlength="7" spellcheck="false">
              </div>
            </label>
            <label class="field">
              <span>描边粗细 <b id="vStroke">2</b></span>
              <input id="strokeW" type="range" min="1" max="20" value="2">
            </label>
          </div>
        </div>

        <!-- 图片 -->
        <div class="pane" id="paneImage" hidden>
          <div class="drop drop-mini" id="logoDrop" tabindex="0" role="button" aria-label="选择水印图片">
            <b id="logoName">点击上传水印图片</b>
            <small>建议使用透明背景的 PNG 标志</small>
            <input type="file" id="logoInput" accept="image/*" hidden>
          </div>
          <div class="row2">
            <label class="field">
              <span>宽度占比 <b id="vLogoScale">18</b>%</span>
              <input id="logoScale" type="range" min="3" max="80" value="18">
            </label>
            <label class="field">
              <span>旋转 <b id="vLogoRot">0</b>°</span>
              <input id="logoRot" type="range" min="-180" max="180" value="0">
            </label>
          </div>
        </div>

        <div class="row2">
          <label class="field">
            <span>不透明度 <b id="vOpacity">55</b>%</span>
            <input id="opacity" type="range" min="5" max="100" value="55">
          </label>
          <label class="field">
            <span>旋转 <b id="vRotate">0</b>°</span>
            <input id="rotate" type="range" min="-180" max="180" value="0">
          </label>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>位置</h2>
          <span class="hint">可直接在预览图上拖动</span>
        </div>
        <div class="grid9" id="grid9">
          <button data-pos="tl" title="左上"></button>
          <button data-pos="tc" title="上中"></button>
          <button data-pos="tr" title="右上"></button>
          <button data-pos="ml" title="左中"></button>
          <button data-pos="mc" class="on" title="正中"></button>
          <button data-pos="mr" title="右中"></button>
          <button data-pos="bl" title="左下"></button>
          <button data-pos="bc" title="下中"></button>
          <button data-pos="br" title="右下"></button>
        </div>
        <div class="seg seg-sm" id="modeSeg">
          <button data-mode="single" class="on">单个水印</button>
          <button data-mode="tile">全屏平铺</button>
        </div>
        <div class="row2" id="tileRow" hidden>
          <label class="field">
            <span>平铺间距 <b id="vGap">80</b></span>
            <input id="gap" type="range" min="10" max="400" value="80">
          </label>
          <label class="field">
            <span>平铺角度 <b id="vTileRot">-30</b>°</span>
            <input id="tileRot" type="range" min="-90" max="90" value="-30">
          </label>
        </div>
        <div class="row2">
          <label class="field">
            <span>边距 <b id="vMargin">24</b></span>
            <input id="margin" type="range" min="0" max="200" value="24">
          </label>
          <label class="field">
            <span>导出格式</span>
            <select id="format">
              <option value="image/jpeg">JPG</option>
              <option value="image/png">PNG</option>
              <option value="image/webp">WebP</option>
            </select>
          </label>
        </div>
        <label class="field" id="qualityRow">
          <span>画质 <b id="vQuality">92</b>%</span>
          <input id="quality" type="range" min="40" max="100" value="92">
        </label>
      </section>

    </aside>

    <!-- ═════════ 右：预览 ═════════ -->
    <section class="preview">
      <div class="preview-bar">
        <div class="pv-left">
          <span class="dot"></span>
          <span id="pvName">未选择图片</span>
        </div>
        <div class="pv-right">
          <button class="btn btn-ghost btn-sm" id="btnFit">适应窗口</button>
          <button class="btn btn-ghost btn-sm" id="btnExportOne" disabled>导出这张</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="stage-empty" id="stageEmpty">
          <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M6.5 16l4-5 3 3.6 2.2-2.4L20 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="8.4" cy="8.6" r="1.3" fill="currentColor"/></svg>
          <p>上传图片后在这里预览水印效果</p>
        </div>
        <canvas id="canvas" hidden></canvas>
      </div>

      <p class="stage-tip" id="stageTip">提示：把水印拖到任意位置，或用左侧九宫格快速定位</p>
    </section>
  </div>
</main>

<div class="toast" id="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
