<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片压缩 · 格式转换 | 超赞工具箱</title>
<meta name="description" content="免费在线批量图片压缩与格式转换：支持 JPG / PNG / WebP / AVIF，可等比缩放、调节画质，一键打包下载。全程浏览器本地处理，不上传图片。">
<meta name="theme-color" content="#0F6E56">
<link rel="icon" href="/assets/logo.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">
    <img src="/assets/logo.svg" alt="超赞工具箱">
    <span>图片压缩</span>
  </a>
  <span class="tagline">批量压缩 · 格式转换 · 等比缩放</span>
  <div class="top-actions">
    <button class="btn btn-ghost" id="btnTheme" title="切换深浅色">◐</button>
    <button class="btn btn-ghost" id="btnClear">清空</button>
    <button class="btn btn-primary" id="btnZip">打包下载 ZIP</button>
  </div>
</header>

<main class="wrap">

  <!-- 设置区 -->
  <section class="settings">
    <div class="set-item">
      <label>输出格式</label>
      <div class="chips" id="formatChips">
        <button data-f="keep" class="is-on">保持原格式</button>
        <button data-f="image/jpeg">JPG</button>
        <button data-f="image/webp">WebP</button>
        <button data-f="image/png">PNG</button>
      </div>
      <div class="hint-line">PNG 无损，压缩收益有限；转 WebP 通常能小 60%+</div>
    </div>

    <div class="set-item">
      <label>画质 <b id="vQuality">82</b></label>
      <input class="rng" type="range" id="quality" min="30" max="100" step="1" value="82">
    </div>

    <div class="set-item">
      <label>最大边长 <b id="vMaxEdge">不限制</b></label>
      <input class="rng" type="range" id="maxEdge" min="0" max="12" step="1" value="0">
      <div class="hint-line">0 = 不缩放 · 超过设定值才等比缩小</div>
    </div>

    <div class="set-item">
      <label>JPG 背景色</label>
      <div class="color-row">
        <input type="color" id="bgColor" value="#ffffff">
        <span class="hint-line">透明 PNG 转 JPG 时的填充色</span>
      </div>
    </div>
  </section>

  <!-- 上传区 -->
  <section class="dropzone" id="dropzone" tabindex="0">
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <div class="dz-inner">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"></path>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
      </svg>
      <p>把图片拖进来，或点击选择 / 直接 Ctrl+V 粘贴</p>
      <small>支持 JPG · PNG · WebP · GIF · AVIF · SVG，可批量</small>
    </div>
  </section>

  <!-- 汇总 -->
  <section class="summary" id="summary" hidden>
    <div class="sum-item"><b id="sumCount">0</b><span>张图片</span></div>
    <div class="sum-item"><b id="sumBefore">0</b><span>压缩前</span></div>
    <div class="sum-item"><b id="sumAfter">0</b><span>压缩后</span></div>
    <div class="sum-item accent"><b id="sumSaved">0%</b><span>体积减少</span></div>
  </section>

  <!-- 列表 -->
  <section class="list" id="list"></section>

  <p class="legal">
    所有图片都在你的浏览器内完成解码、缩放与重编码，不会上传到任何服务器。
    压缩后的图片会丢失 EXIF 信息（拍摄时间、GPS 等），这是浏览器 Canvas 编码的固有行为。
  </p>

</main>

<div class="toast" id="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
