<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>超赞工具箱 · 自媒体人的一站式在线工具集</title>
<meta name="description" content="封面设计、图文排版、短视频处理、开发工具，全部免登录，浏览器本地运行，不上传你的文件。">
<meta name="theme-color" content="#5B4BF5">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="hub.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <a class="brand" href="./">
      <img src="assets/logo.svg" alt="超赞工具箱">
      <span>超赞工具箱</span>
    </a>
    <nav class="cats" id="cats" aria-label="分类"></nav>
    <div class="actions">
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3L4.9 4.9M19.1 19.1l-1.4-1.4M17.7 6.3l1.4-1.4M4.9 19.1l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
      </button>
      <a class="btn" id="blogLink" target="_blank" rel="noopener">我的博客</a>
      <a class="btn" id="repoLink" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <h1>自媒体人的<span class="hl">一站式工具箱</span></h1>
    <p class="sub" id="subtitle">封面、排版、视频、开发工具，全部免登录，浏览器本地运行</p>
    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="搜索工具，例如 封面、排版、二维码" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="quick" id="quick"></div>
  </section>

  <section class="grid" id="grid" aria-live="polite"></section>
  <p class="empty" id="empty" hidden>没有匹配的工具，换个关键词试试</p>

  <section class="follow" id="ftrQr" hidden>
    <div class="follow-head">
      <h2>关注超赞</h2>
      <p>扫码关注公众号与小程序，第一时间获取新工具上线通知</p>
    </div>
    <div class="follow-list" id="ftrQrList"></div>
  </section>

  <section class="legal" id="legal">
    <h2 id="legalTitle">版权与免责声明</h2>
    <ol id="legalList"></ol>
    <p class="legal-more">
      <a href="licenses/NOTICE.txt" target="_blank" rel="noopener">开源许可与第三方版权声明</a>
      <span>·</span>
      <a href="https://github.com/mkmkgo/chaozan-toolbox" target="_blank" rel="noopener">项目源码</a>
    </p>
  </section>
</main>

<footer class="ftr">
  <div class="ftr-inner">
    <div class="ftr-brand">
      <img src="assets/logo.svg" alt="">
      <div>
        <b id="ftrName">超赞工具箱</b>
        <p id="ftrDesc"></p>
      </div>
    </div>
    <div class="ftr-links" id="ftrLinks"></div>
  </div>
  <p class="ftr-note" id="ftrNote"></p>
  <p class="ftr-copy" id="ftrCopy"></p>
</footer>

<script src="hub.js"></script>
</body>
</html>
