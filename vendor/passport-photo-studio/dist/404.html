<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="referrer" content="no-referrer" />
    <title>404 - 页面未找到｜超赞证件照</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f7fb; color: #182230; }
      main { width: min(32rem, calc(100% - 2rem)); padding: 2.5rem; box-sizing: border-box; text-align: center; background: #fff; border: 1px solid #dfe4ec; border-radius: 1rem; box-shadow: 0 1rem 2.5rem rgb(15 23 42 / 8%); }
      strong { display: block; font-size: clamp(3rem, 12vw, 6rem); line-height: 1; color: #2563eb; }
      h1 { margin: 1rem 0 .5rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; color: #526071; }
      a { display: inline-block; padding: .75rem 1.1rem; border-radius: .65rem; background: #2563eb; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <strong aria-hidden="true">404</strong>
      <h1>页面未找到</h1>
      <p>这个地址不存在，或页面已经移动。</p>
      <a href="/">返回超赞工具箱</a>
    </main>
  </body>
</html>
